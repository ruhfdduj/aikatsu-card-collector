<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Card Collector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f8;color:#252329;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#fff;padding:0;box-shadow:0 2px 12px #0001}.fixedbar{background:#fff;padding:12px 14px 10px}.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.appTitle{font-size:20px;font-weight:800}.menuBtn{width:42px;height:42px;padding:0;border-radius:10px;background:#fff;color:#222;border:1px solid #ddd;font-size:25px;line-height:1}.menuBtn span{display:block;line-height:1}.tools{padding:0 14px 12px;background:#fff}.tools .top{margin-top:0;padding-top:10px}.tools .collectionBtn{margin-top:9px}.controls{margin-top:9px}.fixedbar .stats{margin:9px 0 7px}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#777}.top{display:flex;gap:7px;margin-top:10px}.top button{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:9px 11px;background:#222;color:#fff;font-weight:700}.compactBtn{padding:8px 10px;font-size:14px}.light{background:#eee;color:#222}
select,input{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}
.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:12px 0 7px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#222}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.controls input{grid-column:1/-1}
.grid{padding:12px}.coordRow{margin-bottom:20px}.coordTitle{font-size:14px;font-weight:800;margin:0 0 7px 2px}.coordScroll{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 7px}.coordScroll>.card{flex:0 0 118px;width:118px}.card{background:#fff;border-radius:12px;padding:6px;position:relative;box-shadow:0 1px 7px #0001}.card img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;display:block;border-radius:8px;background:#eee}.want{position:absolute;left:10px;bottom:30px;border-radius:7px;width:30px;height:30px;padding:0;background:#fff;color:#222;box-shadow:0 2px 8px #0003;border:2px solid #aaa;z-index:2;font-size:18px;line-height:26px}.wanted .want{background:#fff;color:#d08a00;border-color:#d08a00}.meta{font-size:11px;display:flex;justify-content:space-between;padding:6px 2px 1px;font-weight:700}.card.owned{outline:2px solid #222}.check{position:absolute;right:10px;bottom:30px;border-radius:7px;width:30px;height:30px;padding:0;background:#fff;color:#222;box-shadow:0 2px 8px #0003;border:2px solid #aaa;z-index:2;font-size:18px;line-height:26px}.owned .check{background:#222;color:#fff;border-color:#222}
.sheet,.modal{position:fixed;inset:0;background:#0009;z-index:20;padding:18px;display:grid;place-items:center}.hidden{display:none}.panel{background:#fff;border-radius:18px;padding:15px;width:min(500px,100%);max-height:90vh;overflow:auto}.panel h2{margin:3px 0 8px;font-size:19px}.close{float:right;width:34px;height:34px;border-radius:50%;padding:0;background:#eee;color:#222;font-size:20px}.profileRow{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.menuSheet{position:fixed;inset:0;background:#0007;z-index:30}.menuPanel{position:absolute;top:0;right:0;width:min(390px,88vw);height:100%;background:#fff;box-shadow:-4px 0 20px #0002;overflow:auto}.menuHead{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;border-bottom:1px solid #eee}.menuHead h2{margin:0;font-size:22px}.menuSection{padding:16px;border-bottom:1px solid #eee}.menuLabel{font-size:13px;color:#777;font-weight:700;margin-bottom:8px}.menuItem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;color:#252329;padding:12px 0;border-radius:0;font-weight:600}.menuItem+.menuItem{border-top:1px solid #f1f1f1}.menuIcon{width:24px;text-align:center;font-size:19px}.menuProfile{font-size:17px;font-weight:800;line-height:1.35}.menuSub{font-size:12px;color:#888;margin-top:3px}.profileRow .name{flex:1;font-weight:700}.small{font-size:12px;color:#777}.file{display:none}.msg{text-align:center;padding:30px 15px;color:#777}
</style></head><body>
<header>
<div class="fixedbar">
  <div class="appbar"><div class="appTitle">Card Collector</div><button class="menuBtn" id="menuBtn" aria-label="メニュー"><span>☰</span></button></div>
  <div class="stats"><span id="count">0 / 0</span><span id="pct">0%</span></div><input id="q" placeholder="カード番号・カード名・レアリティを検索">
</div>
<div class="tools">
<div class="controls"><select id="status"><option value="">すべて</option><option value="no">未所持</option><option value="yes">所持</option><option value="want">欲しい</option></select><select id="rarity"><option value="">全レアリティ</option></select></div>
<div class="top"><button class="collectionMode compactBtn" data-mode="trade">交換用モード</button><button id="collectionBtn" class="collectionBtn compactBtn">画像に保存</button></div>
</div>
</header>
<main class="grid" id="grid"></main>
<input id="file" class="file" type="file" accept=".json,application/json,text/plain,application/octet-stream">

<div class="menuSheet hidden" id="menuSheet">
  <div class="menuPanel">
    <div class="menuHead"><h2>メニュー</h2><button class="close" id="menuClose">×</button></div>
    <div class="menuSection"><div class="menuLabel">現在のプロファイル</div><div class="menuProfile" id="menuCurrentProfile">—</div></div>
    <div class="menuSection" id="profileMenuList"></div>
    <div class="menuSection">
      <button class="menuItem" id="menuImport"><span class="menuIcon">＋</span><span>プロファイルをインポート</span></button>
      <button class="menuItem" id="menuExport"><span class="menuIcon">↓</span><span>エクスポート</span></button>
    </div>
  </div>
</div>

<div class="modal hidden" id="collectionModal"><div class="panel">
<button class="close" id="collectionClose">×</button><h2>コレクション画像</h2>
<div style="display:flex;gap:7px;margin-bottom:9px"><button class="light collectionMode" data-mode="owned" style="flex:1">✓ 所持</button><button class="light collectionMode" data-mode="wanted" style="flex:1">☆ 欲しい</button><button class="light collectionMode" data-mode="unowned" style="flex:1">○ 未所持</button></div><div id="collectionInfo" class="small" style="margin-bottom:10px"></div>
<label style="display:inline-flex;align-items:center;gap:7px;margin:8px 0;font-size:14px;white-space:nowrap;writing-mode:horizontal-tb;">
  <input type="checkbox" id="collectionShowUnselected" style="flex:0 0 auto;">
  <span style="white-space:nowrap;">選択していないカードも半透明で表示</span>
</label>
<label style="display:inline-flex;align-items:center;gap:7px;margin:4px 0 8px;font-size:14px;white-space:nowrap;writing-mode:horizontal-tb;">
  <input type="checkbox" id="collectionGroupByCoordinate" style="flex:0 0 auto;">
  <span style="white-space:nowrap;">コーデごとに改行</span>
</label>
<div style="background:#f7f5f8;border-radius:12px;padding:8px;overflow:auto"><canvas id="collectionCanvas" style="display:block;width:100%;height:auto;background:#fff;border-radius:8px"></canvas></div>
<button id="collectionSave" class="compactBtn" style="width:100%;margin-top:10px">画像を保存</button>
</div></div>

<div class="modal hidden" id="modal"><div class="panel">
<button class="close" id="modalClose">×</button><img id="big" style="width:100%;border-radius:10px">
<h2 id="title"></h2><div id="info" class="small"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" id="owned"></button><button style="flex:1" class="light" id="wanted"></button></div>

</div></div>

<script>
const KEY="cardcollector-profiles-v1";
let profiles=JSON.parse(localStorage.getItem(KEY)||"[]"),activeId=localStorage.getItem("cardcollector-active")||"",cur=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(profiles))}
function active(){return profiles.find(p=>p.id===activeId)||profiles[0]}
function stateKey(kind,id){return "cc-"+kind+"-"+id}
function getSet(kind,id){return new Set(JSON.parse(localStorage.getItem(stateKey(kind,id))||"[]"))}
function putSet(kind,id,s){localStorage.setItem(stateKey(kind,id),JSON.stringify([...s]))}
function exportProfile(){
 let p=active();
 if(!p){alert("プロファイルがありません。");return}
 const o=getSet("owned",p.id),w=getSet("wanted",p.id);
 const out={profileVersion:p.profileVersion||1,id:p.id,name:p.name,cards:p.cards.map(c=>({...c,owned:o.has(c.id),wanted:w.has(c.id)}))};
 const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=(p.id||"card-profile")+"-collection.json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function renderProfiles(){renderMenu()}
function renderMenu(){
 const p=active();
 $("menuCurrentProfile").innerHTML=p?esc(p.name):'プロファイルがありません';
 const list=profiles.length?profiles.map(x=>`<div class="profileRow"><div class="name">${esc(x.name)}<div class="small">${x.cards.length}枚</div></div>${x.id===activeId?'<span class="small">使用中</span>':''}<button class="light compactBtn" onclick="selectP('${esc(x.id)}')">開く</button><button class="light compactBtn" aria-label="削除" onclick="removeP('${esc(x.id)}')">削除</button></div>`).join(''):'<div class="msg">まだプロファイルがありません</div>';
 $("profileMenuList").innerHTML=list;
}
function selectP(id){activeId=id;localStorage.setItem("cardcollector-active",id);renderMenu();render();$("menuSheet").classList.add("hidden")}
function removeP(id){if(!confirm("このプロファイルを削除しますか？\n所持情報もこの端末から削除されます。"))return;profiles=profiles.filter(p=>p.id!==id);localStorage.removeItem(stateKey("owned",id));localStorage.removeItem(stateKey("wanted",id));activeId=profiles[0]?.id||"";save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function importFile(file){
 try{
  // iPhone/SafariではGitHubなどから保存した.jsonがtext/plainや
  // application/octet-streamとして渡されることがあるため、file.typeでは判定しない。
  let text=await file.text();
  text=text.replace(/^\uFEFF/,"");
  let p=JSON.parse(text);
  if(!p||!p.name||!Array.isArray(p.cards))throw Error("形式が違います");
  p.id=p.id||("profile-"+Date.now());
  if(profiles.some(x=>x.id===p.id))p.id=p.id+"-"+Date.now();
  p.cards=p.cards.map((c,i)=>({...c,id:c.id||c.number||String(i),rarity:c.rarity||"",image:c.image||""}));
 profiles.push(p);activeId=p.id;
 const owned=new Set(p.cards.filter(c=>c.owned===true).map(c=>c.id));
 const wanted=new Set(p.cards.filter(c=>c.wanted===true).map(c=>c.id));
 if(owned.size)putSet("owned",p.id,owned); else localStorage.removeItem(stateKey("owned",p.id));
 if(wanted.size)putSet("wanted",p.id,wanted); else localStorage.removeItem(stateKey("wanted",p.id));save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render();alert("「"+p.name+"」を追加しました！")}catch(e){alert("プロファイルを読み込めませんでした。JSON形式を確認してください。")}
}
function groupCardsByCoordinate(cards){
 const groups=[],map=new Map();
 cards.forEach(c=>{
   const coord=c.coordinate||c.coord||c.outfit||c.coodinate||c.coodinateName||c.outfitName;
   const key=coord||('__single__'+c.id);
   if(!map.has(key)){const g={key,title:coord||'',cards:[]};map.set(key,g);groups.push(g)}
   map.get(key).cards.push(c);
 });
 return groups;
}
function render(){
 let p=active();if(!p){$('grid').innerHTML='<div class="msg">まず「＋ インポート」からプロファイルを追加してください。</div>';$('count').textContent='0 / 0';$('pct').textContent='0%';return}
 let o=getSet('owned',p.id),w=getSet('wanted',p.id),q=$('q').value.trim().toLowerCase(),st=$('status').value,r=$('rarity').value;
 let rar=[...new Set(p.cards.map(c=>c.rarity).filter(Boolean))];$('rarity').innerHTML='<option value="">全レアリティ</option>'+rar.map(x=>`<option>${esc(x)}</option>`).join('');$('rarity').value=r;
 let list=p.cards.filter(c=>(!q||[c.number,c.name,c.rarity,c.search,c.keywords].flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).join(' ').toLowerCase().includes(q))&&(!r||c.rarity===r)&&(!st||(st==='yes'&&o.has(c.id))||(st==='no'&&!o.has(c.id))||(st==='want'&&w.has(c.id))));
 const groups=groupCardsByCoordinate(list);
 $('grid').innerHTML=groups.map(g=>`<section class="coordRow">${g.title?`<div class="coordTitle">${esc(g.title)}</div>`:''}<div class="coordScroll">${g.cards.map(c=>`<article class="card ${o.has(c.id)?'owned':''} ${w.has(c.id)?'wanted':''}" data-id="${esc(c.id)}"><button class="want" aria-label="欲しい">${w.has(c.id)?'★':'☆'}</button><button class="check" aria-label="所持">${o.has(c.id)?'✓':'○'}</button><img loading="lazy" src="${esc(c.image)}" alt="${esc(c.number)}"><div class="meta"><span>${esc(c.number)}</span><span>${esc(c.rarity)}</span></div><div style="font-size:11px;font-weight:700;line-height:1.35;padding:0 2px 2px;min-height:30px;">${esc(c.name||'')}</div></article>`).join('')}</div></section>`).join('');
 document.querySelectorAll('#grid .card').forEach(e=>{
   e.onclick=()=>openCard(e.dataset.id);
   const btn=e.querySelector('.check');
   btn.onclick=(ev)=>{ev.stopPropagation();const s=getSet('owned',active().id);s.has(e.dataset.id)?s.delete(e.dataset.id):s.add(e.dataset.id);putSet('owned',active().id,s);render()};
   const want=e.querySelector('.want');
   want.onclick=(ev)=>{ev.stopPropagation();const s=getSet('wanted',active().id);s.has(e.dataset.id)?s.delete(e.dataset.id):s.add(e.dataset.id);putSet('wanted',active().id,s);render()};
 });
 let pct=p.cards.length?Math.round(o.size/p.cards.length*100):0;$('count').textContent=`${o.size} / ${p.cards.length}`;$('pct').textContent=pct+'%';
}
function openCard(id){let p=active();cur=p.cards.find(c=>c.id===id);$("modal").classList.remove("hidden");updateModal()}
function updateModal(){let o=getSet("owned",active().id),w=getSet("wanted",active().id);$("big").src=cur.image;$("title").textContent=cur.number+(cur.name?"　"+cur.name:"");$("info").textContent=active().name+"　"+cur.rarity;$("owned").textContent=o.has(cur.id)?"✓ 所持":"☐ 未所持";$("wanted").textContent=w.has(cur.id)?"★ 欲しい":"☆ 欲しい"}
function proxyImageUrl(url){return "https://wsrv.nl/?url="+encodeURIComponent(url)+"&output=png"}
let collectionMode="owned";
function currentFilteredCards(p){
 let o=getSet("owned",p.id),w=getSet("wanted",p.id),
     q=$("q").value.trim().toLowerCase(),st=$("status").value,r=$("rarity").value;
 return p.cards.filter(c=>
   (!q||[c.number,c.name,c.rarity,c.search,c.keywords].flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).join(" ").toLowerCase().includes(q))&&
   (!r||c.rarity===r)&&
   (!st||(st==="yes"&&o.has(c.id))||(st==="no"&&!o.has(c.id))||(st==="want"&&w.has(c.id)))
 );
}
function collectionCards(p,mode){
 const cards=currentFilteredCards(p),o=getSet("owned",p.id),w=getSet("wanted",p.id);
 if(mode==="wanted")return cards.filter(c=>w.has(c.id));
 if(mode==="unowned")return cards.filter(c=>!o.has(c.id));
 return cards.filter(c=>o.has(c.id));
}

function getTradeCount(c,p){
  const key="ownedCount_"+p.id;
  try{
    const obj=JSON.parse(localStorage.getItem(key)||"{}");
    if(Object.prototype.hasOwnProperty.call(obj,c.id)) return Math.max(0,parseInt(obj[c.id],10)||0);
  }catch(e){}
  return getSet("owned",p.id).has(c.id)?1:0;
}
function setTradeCount(c,p,n){
  const key="ownedCount_"+p.id;
  let obj={};
  try{obj=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
  obj[c.id]=Math.max(0,n);
  localStorage.setItem(key,JSON.stringify(obj));
  const owned=getSet("owned",p.id);
  if(n>0) owned.add(c.id); else owned.delete(c.id);
  putSet("owned",p.id,owned);
}
function openTradeMode(){
  const p=active(); if(!p)return;
  const cards=currentFilteredCards(p);
  const overlay=document.createElement("div");
  overlay.id="tradeModeOverlay";
  overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:16px;box-sizing:border-box;";
  overlay.innerHTML=`<div style="max-width:1200px;margin:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">
      <h2 style="margin:0;">交換用モード</h2><button id="tradeClose">閉じる</button>
    </div>
    <div style="font-size:14px;margin-bottom:14px;">インポートしたカードを通常と同じカード表示で並べ、カード下部の－＋で所持枚数を変更できます。</div>
    <div id="tradeRows"></div>
  </div>`;
  document.body.appendChild(overlay);
  const rows=overlay.querySelector("#tradeRows");

  // コーデ単位でまとめる。JSON側にコーデ名がある場合はそれを使用。
  const groups=[], map=new Map();
  cards.forEach(c=>{
    const key=c.coordinate||c.coord||c.outfit||c.coodinate||c.coodinateName||c.outfitName||c.id;
    if(!map.has(key)){
      const g={key,title:c.coordinate||c.coord||c.outfit||c.coodinate||c.coodinateName||c.outfitName||"" ,cards:[]};
      map.set(key,g); groups.push(g);
    }
    map.get(key).cards.push(c);
  });

  groups.forEach((g,gi)=>{
    const row=document.createElement("div");
    row.style.cssText="margin-bottom:24px;";
    if(g.title){
      const title=document.createElement("div");
      title.textContent=g.title;
      title.style.cssText="font-weight:700;font-size:16px;margin:0 0 8px;";
      row.appendChild(title);
    }
    const grid=document.createElement("div");
    grid.style.cssText="display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;align-items:flex-start;";
    g.cards.forEach(c=>{
      const count=getTradeCount(c,p);
      const card=document.createElement("div");
      card.className="card";
      card.style.cssText="position:relative;overflow:hidden;flex:0 0 118px;width:118px;";
      card.innerHTML=`
        <img src="${c.image}" alt="${c.number||""}" style="width:100%;display:block;">
        <div style="font-size:11px;font-weight:700;line-height:1.35;padding:5px 2px 4px;min-height:30px;">${c.name||""}</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 2px 4px;border-top:1px solid #eee;">
          <button class="tradeMinus compactBtn" aria-label="1枚減らす" style="width:26px;height:26px;font-size:17px;line-height:1;padding:0;">−</button>
          <strong class="tradeCount" style="min-width:18px;text-align:center;font-size:14px;">${count}</strong>
          <button class="tradePlus compactBtn" aria-label="1枚増やす" style="width:26px;height:26px;font-size:17px;line-height:1;padding:0;">＋</button>
        </div>`;
      const countEl=card.querySelector(".tradeCount");
      card.querySelector(".tradeMinus").onclick=()=>{
        const n=Math.max(0,getTradeCount(c,p)-1); setTradeCount(c,p,n); countEl.textContent=n;
      };
      card.querySelector(".tradePlus").onclick=()=>{
        const n=getTradeCount(c,p)+1; setTradeCount(c,p,n); countEl.textContent=n;
      };
      grid.appendChild(card);
    });
    row.appendChild(grid);
    rows.appendChild(row);
  });
  overlay.querySelector("#tradeClose").onclick=()=>overlay.remove();
}
async function loadCanvasImage(url){
  const sources=[url,proxyImageUrl(url)];
  for(const src of sources){
    try{const img=new Image();img.crossOrigin='anonymous';img.src=src;await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;setTimeout(()=>rej(new Error('timeout')),8000)});if(img.naturalWidth&&img.naturalHeight)return img;}catch(e){}
  }
  return null;
}
async function makeCollectionImage(mode=collectionMode){
 collectionMode=mode;
 let p=active();if(!p){alert('プロファイルがありません。');return}
 const filtered=currentFilteredCards(p),selected=collectionCards(p,mode);
 const noSelection=selected.length===0&&!$('status').value,effectiveSelected=noSelection?filtered:selected;
 const showUnselected=$('collectionShowUnselected').checked,groupByCoordinate=$('collectionGroupByCoordinate').checked;
 const cards=showUnselected?filtered:effectiveSelected,selectedIds=new Set(effectiveSelected.map(c=>c.id));
 if(!cards.length){alert((mode==='owned'?'所持':mode==='wanted'?'欲しい':'未所持')+'カードがありません。');return}
 $('collectionModal').classList.remove('hidden');$('collectionInfo').textContent='画像を作成しています…';
 document.querySelectorAll('.collectionMode').forEach(b=>{if(b.dataset.mode!=='trade'){b.style.background=b.dataset.mode===mode?'#222':'#eee';b.style.color=b.dataset.mode===mode?'#fff':'#222'}});
 const groups=groupByCoordinate?groupCardsByCoordinate(cards):[{title:'',cards}],maxCols=groupByCoordinate?Math.max(...groups.map(g=>g.cards.length),1):Math.max(cards.length,1);
 const cols=groupByCoordinate?Math.min(maxCols,7):(cards.length<=12?3:cards.length<=30?4:cards.length<=60?5:6),maxCanvasW=1400,pad=24,gap=12;
 const cellW=Math.max(120,Math.floor((maxCanvasW-pad*2-gap*(cols-1))/cols)),imgW=Math.max(95,cellW-18),imgH=Math.round(imgW*1.375),labelH=52,titleH=78,groupTitleH=28,rowGap=12;
 const rowHeights=groups.map(g=>(groupByCoordinate?groupTitleH:0)+imgH+labelH+rowGap),canvas=$('collectionCanvas');
 canvas.width=cols*cellW+pad*2+gap*(cols-1);canvas.height=titleH+rowHeights.reduce((a,b)=>a+b,0)+pad;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#222';ctx.font='bold 24px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(p.name,pad,30);ctx.font='16px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(`${noSelection?'全表示':(mode==='owned'?'所持':mode==='wanted'?'欲しい':'未所持')} ${effectiveSelected.length}枚${showUnselected?'（未選択カードは半透明）':''}`,pad,56);
 const loaded=await Promise.all(cards.map(async c=>({c,img:await loadCanvasImage(c.image)}))),loadedMap=new Map(loaded.map(x=>[x.c.id,x.img]));
 let yCursor=titleH;
 for(const g of groups){
   if(groupByCoordinate&&g.title){ctx.fillStyle='#222';ctx.font='bold 16px sans-serif';ctx.fillText(g.title,pad,yCursor+18);yCursor+=groupTitleH;}
   g.cards.forEach((c,i)=>{const x=pad+i*(cellW+gap)+9,y=yCursor+4,img=loadedMap.get(c.id);ctx.save();if(showUnselected&&!selectedIds.has(c.id))ctx.globalAlpha=.28;if(img){const ratio=Math.min(imgW/img.naturalWidth,imgH/img.naturalHeight),w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;ctx.drawImage(img,x+(imgW-w)/2,y+(imgH-h)/2,w,h)}else{ctx.fillStyle='#eee';ctx.fillRect(x,y,imgW,imgH);ctx.fillStyle='#777';ctx.font='14px sans-serif';ctx.fillText('画像なし',x+10,y+imgH/2)}ctx.fillStyle='#222';ctx.font='bold 14px sans-serif';ctx.fillText(c.number||'',x,y+imgH+18);if(c.rarity){ctx.font='13px sans-serif';ctx.fillText(c.rarity,x+Math.max(70,imgW-32),y+imgH+18)}if(c.name){ctx.font='12px sans-serif';ctx.fillText(String(c.name).slice(0,16),x,y+imgH+38)}ctx.restore();});
   yCursor+=imgH+labelH+rowGap;
 }
 $('collectionInfo').textContent=`${cards.length}枚をまとめました。現在の絞り込みを反映しています。`;
}
function saveCollectionImage(){
 const canvas=$("collectionCanvas");
 try{canvas.toBlob(blob=>{if(!blob){alert("画像を保存できませんでした。");return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="collection.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png")}
 catch(e){alert("画像を保存できませんでした。カード画像のサイト側の制限により、保存できない場合があります。")}
}
