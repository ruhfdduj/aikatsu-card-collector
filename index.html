<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Card Collector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f8;color:#252329;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#fff;padding:0;box-shadow:0 2px 12px #0001}.fixedbar{background:#fff;padding:12px 14px 10px}.tools{padding:0 14px 12px;background:#fff}.tools .top{margin-top:0;padding-top:10px}.tools .collectionBtn{margin-top:9px}.controls{margin-top:9px}.fixedbar .stats{margin:9px 0 7px}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#777}.top{display:flex;gap:7px;margin-top:10px}.top button{flex:1}
button{font:inherit;border:0;border-radius:11px;padding:11px;background:#222;color:#fff;font-weight:700}.light{background:#eee;color:#222}
select,input{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}
.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:12px 0 7px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#222}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.controls input{grid-column:1/-1}
.grid{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:#fff;border-radius:12px;padding:6px;position:relative;box-shadow:0 1px 7px #0001}.card img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;display:block;border-radius:8px;background:#eee}.want{position:absolute;left:10px;bottom:30px;border-radius:7px;width:30px;height:30px;padding:0;background:#fff;color:#222;box-shadow:0 2px 8px #0003;border:2px solid #aaa;z-index:2;font-size:18px;line-height:26px}.wanted .want{background:#fff;color:#d08a00;border-color:#d08a00}.meta{font-size:11px;display:flex;justify-content:space-between;padding:6px 2px 1px;font-weight:700}.card.owned{outline:2px solid #222}.check{position:absolute;right:10px;bottom:30px;border-radius:7px;width:30px;height:30px;padding:0;background:#fff;color:#222;box-shadow:0 2px 8px #0003;border:2px solid #aaa;z-index:2;font-size:18px;line-height:26px}.owned .check{background:#222;color:#fff;border-color:#222}
.sheet,.modal{position:fixed;inset:0;background:#0009;z-index:20;padding:18px;display:grid;place-items:center}.hidden{display:none}.panel{background:#fff;border-radius:18px;padding:15px;width:min(500px,100%);max-height:90vh;overflow:auto}.panel h2{margin:3px 0 8px;font-size:19px}.close{float:right;width:34px;height:34px;border-radius:50%;padding:0;background:#eee;color:#222;font-size:20px}.profileRow{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.profileRow .name{flex:1;font-weight:700}.small{font-size:12px;color:#777}.file{display:none}.msg{text-align:center;padding:30px 15px;color:#777}
</style></head><body>
<header>
<div class="fixedbar">
<select id="profileSelect"></select>
<div class="stats"><span id="count">0 / 0</span><span id="pct">0%</span></div><input id="q" placeholder="カード番号・カード名・レアリティを検索">
</div>
<div class="tools">
<div class="top"><button id="profilesBtn">📚 プロファイル</button><button class="light" id="importBtn">＋ インポート</button></div>
<div class="controls"><select id="status"><option value="">すべて</option><option value="no">未所持</option><option value="yes">所持</option><option value="want">欲しい</option></select><select id="rarity"><option value="">全レアリティ</option></select></div>
<div class="top"><button class="collectionMode" data-mode="trade" style="margin-right:6px;">交換用モード</button><button id="collectionBtn" class="collectionBtn">🖼️ 画像に保存</button><button class="light" id="exportBtn">💾 エクスポート</button></div>
</div>
</header>
<main class="grid" id="grid"></main>
<input id="file" class="file" type="file" accept=".json,application/json">

<div class="sheet hidden" id="profilesSheet"><div class="panel">
<button class="close" id="profilesClose">×</button><h2>プロファイル管理</h2>
<div class="small">カードの「弾」ごとにプロファイルを追加できます。</div>
<div id="profileList"></div>
<button style="width:100%;margin-top:12px" id="sheetImport">＋ プロファイルをインポート</button>
</div></div>

<div class="modal hidden" id="collectionModal"><div class="panel">
<button class="close" id="collectionClose">×</button><h2>コレクション画像</h2>
<div style="display:flex;gap:7px;margin-bottom:9px"><button class="light collectionMode" data-mode="owned" style="flex:1">✓ 所持</button><button class="light collectionMode" data-mode="wanted" style="flex:1">☆ 欲しい</button><button class="light collectionMode" data-mode="unowned" style="flex:1">○ 未所持</button></div><div id="collectionInfo" class="small" style="margin-bottom:10px"></div>
<label style="display:inline-flex;align-items:center;gap:7px;margin:8px 0;font-size:14px;white-space:nowrap;writing-mode:horizontal-tb;">
  <input type="checkbox" id="collectionShowUnselected" style="flex:0 0 auto;">
  <span style="white-space:nowrap;">選択していないカードも半透明で表示</span>
</label>
<div style="background:#f7f5f8;border-radius:12px;padding:8px;overflow:auto"><canvas id="collectionCanvas" style="display:block;width:100%;height:auto;background:#fff;border-radius:8px"></canvas></div>
<button id="collectionSave" style="width:100%;margin-top:10px">画像に保存</button>
</div></div>

<div class="modal hidden" id="modal"><div class="panel">
<button class="close" id="modalClose">×</button><img id="big" style="width:100%;border-radius:10px">
<h2 id="title"></h2><div id="info" class="small"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" id="owned"></button><button style="flex:1" class="light" id="wanted"></button></div>

</div></div>

<script>
const KEY="cardcollector-profiles-v1";
let profiles=JSON.parse(localStorage.getItem(KEY)||"[]"),activeId=localStorage.getItem("cardcollector-active")||"",cur=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(profiles))}
function active(){return profiles.find(p=>p.id===activeId)||profiles[0]}
function stateKey(kind,id){return "cc-"+kind+"-"+id}
function getSet(kind,id){return new Set(JSON.parse(localStorage.getItem(stateKey(kind,id))||"[]"))}
function putSet(kind,id,s){localStorage.setItem(stateKey(kind,id),JSON.stringify([...s]))}
function exportProfile(){
 let p=active();
 if(!p){alert("プロファイルがありません。");return}
 const o=getSet("owned",p.id),w=getSet("wanted",p.id);
 const out={profileVersion:p.profileVersion||1,id:p.id,name:p.name,cards:p.cards.map(c=>({...c,owned:o.has(c.id),wanted:w.has(c.id)}))};
 const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=(p.id||"card-profile")+"-collection.json";document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function renderProfiles(){
 let p=profiles;$("profileSelect").innerHTML=p.length?p.map(x=>`<option value="${x.id}" ${x.id===activeId?"selected":""}>${esc(x.name)}</option>`).join(""):'<option>プロファイルをインポートしてください</option>';
 $("profileList").innerHTML=p.length?p.map(x=>`<div class="profileRow"><div class="name">${esc(x.name)}<div class="small">${x.cards.length}枚</div></div><button class="light" onclick="selectP('${x.id}')">開く</button><button style="background:#b22" onclick="removeP('${x.id}')">削除</button></div>`).join(""):'<div class="msg">まだプロファイルがありません</div>';
}
function selectP(id){activeId=id;localStorage.setItem("cardcollector-active",id);renderProfiles();render();$("profilesSheet").classList.add("hidden")}
function removeP(id){if(!confirm("このプロファイルを削除しますか？\n所持情報もこの端末から削除されます。"))return;profiles=profiles.filter(p=>p.id!==id);localStorage.removeItem(stateKey("owned",id));localStorage.removeItem(stateKey("wanted",id));activeId=profiles[0]?.id||"";save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function importFile(file){
 try{let p=JSON.parse(await file.text());if(!p||!p.name||!Array.isArray(p.cards))throw Error("形式が違います");p.id=p.id||("profile-"+Date.now());if(profiles.some(x=>x.id===p.id))p.id=p.id+"-"+Date.now();p.cards=p.cards.map((c,i)=>({...c,id:c.id||c.number||String(i),rarity:c.rarity||"",image:c.image||""}));
 profiles.push(p);activeId=p.id;
 const owned=new Set(p.cards.filter(c=>c.owned===true).map(c=>c.id));
 const wanted=new Set(p.cards.filter(c=>c.wanted===true).map(c=>c.id));
 if(owned.size)putSet("owned",p.id,owned); else localStorage.removeItem(stateKey("owned",p.id));
 if(wanted.size)putSet("wanted",p.id,wanted); else localStorage.removeItem(stateKey("wanted",p.id));save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render();alert("「"+p.name+"」を追加しました！")}catch(e){alert("プロファイルを読み込めませんでした。JSON形式を確認してください。")}
}
function render(){
 let p=active();if(!p){$("grid").innerHTML='<div class="msg" style="grid-column:1/-1">まず「＋ インポート」からプロファイルを追加してください。</div>';$("count").textContent="0 / 0";$("pct").textContent="0%";return}
 let o=getSet("owned",p.id),w=getSet("wanted",p.id),q=$("q").value.trim().toLowerCase(),st=$("status").value,r=$("rarity").value;
 let rar=[...new Set(p.cards.map(c=>c.rarity).filter(Boolean))];$("rarity").innerHTML='<option value="">全レアリティ</option>'+rar.map(x=>`<option>${esc(x)}</option>`).join("");$("rarity").value=r;
 let list=p.cards.filter(c=>(!q||[c.number,c.name,c.rarity,c.search,c.keywords].flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).join(" ").toLowerCase().includes(q))&&(!r||c.rarity===r)&&(!st||(st==="yes"&&o.has(c.id))||(st==="no"&&!o.has(c.id))||(st==="want"&&w.has(c.id))));
 $("grid").innerHTML=list.map(c=>`<article class="card ${o.has(c.id)?"owned":""} ${w.has(c.id)?"wanted":""}" data-id="${esc(c.id)}"><button class="want" aria-label="欲しい">${w.has(c.id)?"★":"☆"}</button><button class="check" aria-label="所持">${o.has(c.id)?"✓":"○"}</button><img loading="lazy" src="${esc(c.image)}" alt="${esc(c.number)}"><div class="meta"><span>${esc(c.number)}</span><span>${esc(c.rarity)}</span></div></article>`).join("");
 document.querySelectorAll(".card").forEach(e=>{
   e.onclick=()=>openCard(e.dataset.id);
   const btn=e.querySelector(".check");
   btn.onclick=(ev)=>{ev.stopPropagation();const s=getSet("owned",active().id);s.has(e.dataset.id)?s.delete(e.dataset.id):s.add(e.dataset.id);putSet("owned",active().id,s);render()};
   const want=e.querySelector(".want");
   want.onclick=(ev)=>{ev.stopPropagation();const s=getSet("wanted",active().id);s.has(e.dataset.id)?s.delete(e.dataset.id):s.add(e.dataset.id);putSet("wanted",active().id,s);render()};
 });
 let pct=p.cards.length?Math.round(o.size/p.cards.length*100):0;$("count").textContent=`${o.size} / ${p.cards.length}`;$("pct").textContent=pct+"%";
}
function openCard(id){let p=active();cur=p.cards.find(c=>c.id===id);$("modal").classList.remove("hidden");updateModal()}
function updateModal(){let o=getSet("owned",active().id),w=getSet("wanted",active().id);$("big").src=cur.image;$("title").textContent=cur.number+(cur.name?"　"+cur.name:"");$("info").textContent=active().name+"　"+cur.rarity;$("owned").textContent=o.has(cur.id)?"✓ 所持":"☐ 未所持";$("wanted").textContent=w.has(cur.id)?"★ 欲しい":"☆ 欲しい"}
function proxyImageUrl(url){return "https://wsrv.nl/?url="+encodeURIComponent(url)+"&output=png"}
let collectionMode="owned";
function currentFilteredCards(p){
 let o=getSet("owned",p.id),w=getSet("wanted",p.id),
     q=$("q").value.trim().toLowerCase(),st=$("status").value,r=$("rarity").value;
 return p.cards.filter(c=>
   (!q||[c.number,c.name,c.rarity,c.search,c.keywords].flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).join(" ").toLowerCase().includes(q))&&
   (!r||c.rarity===r)&&
   (!st||(st==="yes"&&o.has(c.id))||(st==="no"&&!o.has(c.id))||(st==="want"&&w.has(c.id)))
 );
}
function collectionCards(p,mode){
 const cards=currentFilteredCards(p),o=getSet("owned",p.id),w=getSet("wanted",p.id);
 if(mode==="wanted")return cards.filter(c=>w.has(c.id));
 if(mode==="unowned")return cards.filter(c=>!o.has(c.id));
 return cards.filter(c=>o.has(c.id));
}

function getTradeCount(c,p){
  const key="ownedCount_"+p.id;
  try{
    const obj=JSON.parse(localStorage.getItem(key)||"{}");
    return Math.max(0,parseInt(obj[c.id]||0,10)||0);
  }catch(e){return 0}
}
function setTradeCount(c,p,n){
  const key="ownedCount_"+p.id;
  let obj={};
  try{obj=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
  obj[c.id]=Math.max(0,n);
  localStorage.setItem(key,JSON.stringify(obj));
}
function openTradeMode(){
  const p=active(); if(!p)return;
  const cards=currentFilteredCards(p);
  const overlay=document.createElement("div");
  overlay.id="tradeModeOverlay";
  overlay.style.cssText="position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:16px;box-sizing:border-box;";
  overlay.innerHTML=`<div style="max-width:900px;margin:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">
      <h2 style="margin:0;">交換用モード</h2>
      <button id="tradeClose">閉じる</button>
    </div>
    <div style="font-size:14px;margin-bottom:14px;">現在の絞り込み中のカードについて、所持枚数を設定できます。</div>
    <div id="tradeGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;"></div>
  </div>`;
  document.body.appendChild(overlay);
  const grid=overlay.querySelector("#tradeGrid");
  cards.forEach(c=>{
    const count=getTradeCount(c,p);
    const card=document.createElement("div");
    card.style.cssText="border:1px solid #ddd;border-radius:10px;padding:8px;background:#fff;";
    card.innerHTML=`<img src="${c.image}" style="width:100%;aspect-ratio:3/4;object-fit:contain;display:block;"><div style="font-weight:700;margin-top:5px;">${c.number||""}</div><div style="font-size:12px;">${c.name||""}</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:7px;"><button class="tradeMinus">−</button><strong class="tradeCount">${count}</strong><button class="tradePlus">＋</button></div>`;
    card.querySelector(".tradeMinus").onclick=()=>{const n=Math.max(0,getTradeCount(c,p)-1);setTradeCount(c,p,n);card.querySelector(".tradeCount").textContent=n;};
    card.querySelector(".tradePlus").onclick=()=>{const n=getTradeCount(c,p)+1;setTradeCount(c,p,n);card.querySelector(".tradeCount").textContent=n;};
    grid.appendChild(card);
  });
  overlay.querySelector("#tradeClose").onclick=()=>overlay.remove();
}
async function makeCollectionImage(mode=collectionMode){
 collectionMode=mode;
 let p=active();if(!p){alert("プロファイルがありません。");return}
 const filtered=currentFilteredCards(p);
 const selected=collectionCards(p,mode);
 const noSelection = selected.length===0 && !($("status").value);
 const effectiveSelected = noSelection ? filtered : selected;
 const showUnselected=$("collectionShowUnselected").checked;
 const cards=showUnselected?filtered:effectiveSelected;
 const selectedIds=new Set(effectiveSelected.map(c=>c.id));
 if(!cards.length){alert((mode==="owned"?"所持":mode==="wanted"?"欲しい":"未所持")+"カードがありません。");return}
 $("collectionModal").classList.remove("hidden");
 $("collectionInfo").textContent=`${cards.length}枚を画像にまとめています…`;
 document.querySelectorAll(".collectionMode").forEach(b=>{b.style.background=b.dataset.mode===mode?"#222":"#eee";b.style.color=b.dataset.mode===mode?"#fff":"#222"});
 const n=cards.length;
 const cols=n<=12?3:n<=30?4:n<=60?5:6;
 const maxCanvasW=1800,pad=30,gap=18;
 const cellW=Math.floor((maxCanvasW-pad*2-gap*(cols-1))/cols);
 const imgW=Math.max(150,cellW-28);
 const imgH=Math.round(imgW*1.375);
 const labelH=58,titleH=105,rows=Math.ceil(n/cols),canvas=$("collectionCanvas");
 canvas.width=cols*cellW+pad*2+gap*(cols-1);
 canvas.height=titleH+rows*(imgH+labelH)+pad;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#222";
 ctx.font=`bold ${n>60?26:30}px -apple-system,BlinkMacSystemFont,sans-serif`;
 ctx.fillText(p.name,pad,48);
 ctx.font=`${n>60?18:21}px -apple-system,BlinkMacSystemFont,sans-serif`;
 ctx.fillText(`${noSelection?"全表示":(mode==="owned"?"所持":mode==="wanted"?"欲しい":"未所持")} ${effectiveSelected.length}枚${showUnselected?"（未選択カードは半透明）":""}`,pad,80);

 const loaded=await Promise.all(cards.map(async c=>{
   try{
     const img=new Image();img.crossOrigin="anonymous";img.src=proxyImageUrl(c.image);
     await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;setTimeout(()=>rej(new Error("timeout")),10000)});
     return {c,img};
   }catch(e){return {c,img:null}}
 }));

 for(let i=0;i<loaded.length;i++){
   const {c,img}=loaded[i],
         x=pad+(i%cols)*(cellW+gap)+14,
         y=titleH+Math.floor(i/cols)*(imgH+labelH)+10;
   ctx.save();
   if(showUnselected&&!selectedIds.has(c.id))ctx.globalAlpha=0.28;
   if(img){
     const ratio=Math.min(imgW/img.naturalWidth,imgH/img.naturalHeight),
           w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
     ctx.drawImage(img,x+(imgW-w)/2,y+(imgH-h)/2,w,h);
   }else{
     ctx.fillStyle="#eee";ctx.fillRect(x,y,imgW,imgH);
     ctx.fillStyle="#777";ctx.font="20px sans-serif";ctx.fillText("画像を取得できません",x+35,y+220);
   }
   ctx.fillStyle="#222";ctx.font=`bold ${n>60?17:20}px sans-serif`;
   ctx.fillText(c.number||"",x,y+imgH+25);
   ctx.font=`${n>60?15:18}px sans-serif`;
   ctx.fillText(c.rarity||"",x+Math.max(90,imgW-55),y+imgH+25);
   if(c.name){ctx.font=`${n>60?13:16}px sans-serif`;ctx.fillText(String(c.name).slice(0,18),x,y+imgH+48)}
   ctx.restore();
 }
 $("collectionInfo").textContent=`${cards.length}枚をまとめました。現在の絞り込みを反映しています。`;
}
function saveCollectionImage(){
 const canvas=$("collectionCanvas");
 try{canvas.toBlob(blob=>{if(!blob){alert("画像を保存できませんでした。");return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="collection.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"image/png")}
 catch(e){alert("画像を保存できませんでした。カード画像のサイト側の制限により、保存できない場合があります。")}
}
document.querySelectorAll(".collectionMode").forEach(b=>b.onclick=()=>makeCollectionImage(b.dataset.mode));
$("collectionBtn").onclick=()=>makeCollectionImage(collectionMode);document.querySelector('[data-mode="trade"]')?.addEventListener("click",openTradeMode);$("collectionShowUnselected").onchange=()=>{
 if(!$("collectionModal").classList.contains("hidden")) makeCollectionImage(collectionMode);
};$("exportBtn").onclick=exportProfile;$("collectionSave").onclick=saveCollectionImage;$("collectionClose").onclick=()=>$("collectionModal").classList.add("hidden");$("importBtn").onclick=()=>$("file").click();$("sheetImport").onclick=()=>$("file").click();$("file").onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=""};
$("profilesBtn").onclick=()=>{$("profilesSheet").classList.remove("hidden");renderProfiles()};$("profilesClose").onclick=()=>$("profilesSheet").classList.add("hidden");
$("profileSelect").onchange=e=>selectP(e.target.value);$("modalClose").onclick=()=>$("modal").classList.add("hidden");
$("owned").onclick=()=>{let s=getSet("owned",active().id);s.has(cur.id)?s.delete(cur.id):s.add(cur.id);putSet("owned",active().id,s);render();updateModal()};
$("wanted").onclick=()=>{let s=getSet("wanted",active().id);s.has(cur.id)?s.delete(cur.id):s.add(cur.id);putSet("wanted",active().id,s);render();updateModal()};
["q","status","rarity"].forEach(id=>$(id).oninput=render);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!profiles.length)importFileFetch();renderProfiles();render();
async function importFileFetch(){try{let p=await (await fetch("profiles/aikatsu-encore-01.json")).json();profiles=[p];activeId=p.id;save();localStorage.setItem("cardcollector-active",activeId)}catch(e){}}
</script></body></html>
