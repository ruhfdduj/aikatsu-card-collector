<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>Card Collector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f8;color:#252329;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px;box-shadow:0 2px 12px #0001}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#777}.top{display:flex;gap:7px;margin-top:10px}.top button{flex:1}
button{font:inherit;border:0;border-radius:11px;padding:11px;background:#222;color:#fff;font-weight:700}.light{background:#eee;color:#222}
select,input{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}
.stats{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:12px 0 7px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#222}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.controls input{grid-column:1/-1}
.grid{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:#fff;border-radius:12px;padding:6px;position:relative;box-shadow:0 1px 7px #0001}.card img{width:100%;aspect-ratio:.7;object-fit:cover;border-radius:8px;background:#eee}.meta{font-size:11px;display:flex;justify-content:space-between;padding:6px 2px 1px;font-weight:700}.card.owned{outline:2px solid #222}.check{position:absolute;right:8px;top:8px;border-radius:50%;width:30px;height:30px;padding:0;background:#fff;color:#222;box-shadow:0 2px 8px #0003}.owned .check{background:#222;color:#fff}
.sheet,.modal{position:fixed;inset:0;background:#0009;z-index:20;padding:18px;display:grid;place-items:center}.hidden{display:none}.panel{background:#fff;border-radius:18px;padding:15px;width:min(500px,100%);max-height:90vh;overflow:auto}.panel h2{margin:3px 0 8px;font-size:19px}.close{float:right;width:34px;height:34px;border-radius:50%;padding:0;background:#eee;color:#222;font-size:20px}.profileRow{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.profileRow .name{flex:1;font-weight:700}.small{font-size:12px;color:#777}.file{display:none}.msg{text-align:center;padding:30px 15px;color:#777}
</style></head><body>
<header>
<h1>Card Collector</h1><div class="sub">プロファイルを追加してカードを集めよう</div>
<div class="top"><button id="profilesBtn">📚 プロファイル</button><button class="light" id="importBtn">＋ インポート</button></div>
<div class="top"><button id="collectionBtn">🖼️ コレクション画像を作る</button></div>
<select id="profileSelect" style="margin-top:9px"></select>
<div class="stats"><span id="count">0 / 0</span><span id="pct">0%</span></div><div class="progress"><i id="bar"></i></div>
<div class="controls"><input id="q" placeholder="カード番号・レアリティ・名前"><select id="status"><option value="">すべて</option><option value="no">未所持</option><option value="yes">所持</option><option value="want">欲しい</option></select><select id="rarity"><option value="">全レアリティ</option></select></div>
</header>
<main class="grid" id="grid"></main>
<input id="file" class="file" type="file" accept=".json,application/json">

<div class="sheet hidden" id="profilesSheet"><div class="panel">
<button class="close" id="profilesClose">×</button><h2>プロファイル管理</h2>
<div class="small">カードの「弾」ごとにプロファイルを追加できます。</div>
<div id="profileList"></div>
<button style="width:100%;margin-top:12px" id="sheetImport">＋ プロファイルをインポート</button>
</div></div>

<div class="modal hidden" id="modal"><div class="panel">
<button class="close" id="modalClose">×</button><img id="big" style="width:100%;border-radius:10px">
<h2 id="title"></h2><div id="info" class="small"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" id="owned"></button><button style="flex:1" class="light" id="wanted"></button></div>
<button style="width:100%;margin-top:8px" class="light" id="flip">裏面を見る</button>
</div></div>


<div class="modal hidden" id="collectionModal"><div class="panel">
<button class="close" id="collectionClose">×</button><h2>コレクション画像</h2>
<div class="small" id="collectionInfo" style="margin-bottom:10px"></div>
<canvas id="collectionCanvas" style="width:100%;border-radius:10px;background:#fff"></canvas>
<button style="width:100%;margin-top:10px" id="saveCollection">画像を保存</button>
<button style="width:100%;margin-top:8px" class="light" id="rebuildCollection">作り直す</button>
</div></div>
<script>
const KEY="cardcollector-profiles-v1";
let profiles=JSON.parse(localStorage.getItem(KEY)||"[]"),activeId=localStorage.getItem("cardcollector-active")||"",cur=null,back=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(profiles))}
function active(){return profiles.find(p=>p.id===activeId)||profiles[0]}
function stateKey(kind,id){return "cc-"+kind+"-"+id}
function getSet(kind,id){return new Set(JSON.parse(localStorage.getItem(stateKey(kind,id))||"[]"))}
function putSet(kind,id,s){localStorage.setItem(stateKey(kind,id),JSON.stringify([...s]))}
function renderProfiles(){
 let p=profiles;$("profileSelect").innerHTML=p.length?p.map(x=>`<option value="${x.id}" ${x.id===activeId?"selected":""}>${esc(x.name)}</option>`).join(""):'<option>プロファイルをインポートしてください</option>';
 $("profileList").innerHTML=p.length?p.map(x=>`<div class="profileRow"><div class="name">${esc(x.name)}<div class="small">${x.cards.length}枚</div></div><button class="light" onclick="selectP('${x.id}')">開く</button><button style="background:#b22" onclick="removeP('${x.id}')">削除</button></div>`).join(""):'<div class="msg">まだプロファイルがありません</div>';
}
function selectP(id){activeId=id;localStorage.setItem("cardcollector-active",id);renderProfiles();render();$("profilesSheet").classList.add("hidden")}
function removeP(id){if(!confirm("このプロファイルを削除しますか？\n所持情報もこの端末から削除されます。"))return;profiles=profiles.filter(p=>p.id!==id);localStorage.removeItem(stateKey("owned",id));localStorage.removeItem(stateKey("wanted",id));activeId=profiles[0]?.id||"";save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function importFile(file){
 try{let p=JSON.parse(await file.text());if(!p||!p.name||!Array.isArray(p.cards))throw Error("形式が違います");p.id=p.id||("profile-"+Date.now());if(profiles.some(x=>x.id===p.id))p.id=p.id+"-"+Date.now();p.cards=p.cards.map((c,i)=>({...c,id:c.id||c.number||String(i),rarity:c.rarity||"",image:c.image||""}));profiles.push(p);activeId=p.id;save();localStorage.setItem("cardcollector-active",activeId);renderProfiles();render();alert("「"+p.name+"」を追加しました！")}catch(e){alert("プロファイルを読み込めませんでした。JSON形式を確認してください。")}
}
function render(){
 let p=active();if(!p){$("grid").innerHTML='<div class="msg" style="grid-column:1/-1">まず「＋ インポート」からプロファイルを追加してください。</div>';$("count").textContent="0 / 0";$("pct").textContent="0%";$("bar").style.width="0";return}
 let o=getSet("owned",p.id),w=getSet("wanted",p.id),q=$("q").value.toLowerCase(),st=$("status").value,r=$("rarity").value;
 let rar=[...new Set(p.cards.map(c=>c.rarity).filter(Boolean))];$("rarity").innerHTML='<option value="">全レアリティ</option>'+rar.map(x=>`<option>${esc(x)}</option>`).join("");$("rarity").value=r;
 let list=p.cards.filter(c=>(!q||[c.number,c.name,c.rarity].join(" ").toLowerCase().includes(q))&&(!r||c.rarity===r)&&(!st||(st==="yes"&&o.has(c.id))||(st==="no"&&!o.has(c.id))||(st==="want"&&w.has(c.id))));
 $("grid").innerHTML=list.map(c=>`<article class="card ${o.has(c.id)?"owned":""}" data-id="${esc(c.id)}"><button class="check">${o.has(c.id)?"✓":"○"}</button>${w.has(c.id)?'<span style="position:absolute;left:8px;top:8px;background:#fff;border-radius:10px;padding:3px 6px">★</span>':""}<img loading="lazy" src="${esc(c.image)}" alt="${esc(c.number)}"><div class="meta"><span>${esc(c.number)}</span><span>${esc(c.rarity)}</span></div></article>`).join("");
 document.querySelectorAll(".card").forEach(e=>e.onclick=()=>openCard(e.dataset.id));
 let pct=p.cards.length?Math.round(o.size/p.cards.length*100):0;$("count").textContent=`${o.size} / ${p.cards.length}`;$("pct").textContent=pct+"%";$("bar").style.width=pct+"%";
}
function openCard(id){let p=active();cur=p.cards.find(c=>c.id===id);back=false;$("modal").classList.remove("hidden");updateModal()}
function updateModal(){let o=getSet("owned",active().id),w=getSet("wanted",active().id);$("big").src=back?(cur.backImage||cur.image):cur.image;$("title").textContent=cur.number+(cur.name?"　"+cur.name:"");$("info").textContent=active().name+"　"+cur.rarity;$("owned").textContent=o.has(cur.id)?"✓ 所持":"☐ 未所持";$("wanted").textContent=w.has(cur.id)?"★ 欲しい":"☆ 欲しい";$("flip").textContent=back?"表面を見る":"裏面を見る"}

async function makeCollectionImage(){
 let p=active(); if(!p){alert("先にプロファイルを追加してください。");return}
 let o=getSet("owned",p.id); let cards=p.cards.filter(c=>o.has(c.id));
 if(!cards.length){alert("所持カードにチェックが付いていません。");return}
 const canvas=$("collectionCanvas"), ctx=canvas.getContext("2d");
 const cols=4, cardW=220, gap=16, pad=28, titleH=86, metaH=30;
 const rows=Math.ceil(cards.length/cols), cardH=Math.round(cardW/0.7), width=pad*2+cols*cardW+(cols-1)*gap, height=pad*2+titleH+rows*(cardH+metaH)+(rows-1)*gap;
 canvas.width=width*2; canvas.height=height*2; ctx.scale(2,2);
 ctx.fillStyle="#f7f5f8";ctx.fillRect(0,0,width,height);
 ctx.fillStyle="#252329";ctx.font="bold 25px -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif";ctx.fillText(p.name,pad,pad+30);
 ctx.font="bold 15px -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif";ctx.fillStyle="#666";ctx.fillText(`コレクション ${cards.length} / ${p.cards.length}`,pad,pad+56);
 for(let i=0;i<cards.length;i++){
   const c=cards[i], col=i%cols,row=Math.floor(i/cols),x=pad+col*(cardW+gap),y=pad+titleH+row*(cardH+metaH+gap);
   ctx.fillStyle="#fff";ctx.fillRect(x,y,cardW,cardH);
   try{
     const img=await loadImage(c.image);
     const ratio=Math.max(cardW/img.naturalWidth,cardH/img.naturalHeight);
     const sw=img.naturalWidth*ratio, sh=img.naturalHeight*ratio;
     ctx.drawImage(img,x+(cardW-sw)/2,y+(cardH-sh)/2,sw,sh);
   }catch(e){
     ctx.fillStyle="#eee";ctx.fillRect(x,y,cardW,cardH);ctx.fillStyle="#777";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("画像を読み込めません",x+cardW/2,y+cardH/2);ctx.textAlign="left";
   }
   ctx.fillStyle="#252329";ctx.font="bold 13px sans-serif";ctx.fillText(c.number||"",x,y+cardH+20);
   if(c.rarity){ctx.fillStyle="#777";ctx.font="12px sans-serif";ctx.textAlign="right";ctx.fillText(c.rarity,x+cardW,y+cardH+20);ctx.textAlign="left"}
 }
 $("collectionInfo").textContent=`${cards.length}枚の所持カードを一覧にしました。`;
 $("collectionModal").classList.remove("hidden");
}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin="anonymous";img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
async function saveCollectionImage(){
 const canvas=$("collectionCanvas");
 try{
   const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(),"image/png"));
   const file=new File([blob],"aikatsu-collection.png",{type:"image/png"});
   if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"アイカツ！コレクション"});return}
   const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aikatsu-collection.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }catch(e){alert("画像を保存できませんでした。カード画像の読み込みを許可している環境でお試しください。")}
}
$("importBtn").onclick=()=>$("file").click();$("collectionBtn").onclick=makeCollectionImage;$("collectionClose").onclick=()=>$("collectionModal").classList.add("hidden");$("rebuildCollection").onclick=makeCollectionImage;$("saveCollection").onclick=saveCollectionImage;$("sheetImport").onclick=()=>$("file").click();$("file").onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=""};
$("profilesBtn").onclick=()=>{$("profilesSheet").classList.remove("hidden");renderProfiles()};$("profilesClose").onclick=()=>$("profilesSheet").classList.add("hidden");
$("profileSelect").onchange=e=>selectP(e.target.value);$("modalClose").onclick=()=>$("modal").classList.add("hidden");$("flip").onclick=()=>{back=!back;updateModal()};
$("owned").onclick=()=>{let s=getSet("owned",active().id);s.has(cur.id)?s.delete(cur.id):s.add(cur.id);putSet("owned",active().id,s);render();updateModal()};
$("wanted").onclick=()=>{let s=getSet("wanted",active().id);s.has(cur.id)?s.delete(cur.id):s.add(cur.id);putSet("wanted",active().id,s);render();updateModal()};
["q","status","rarity"].forEach(id=>$(id).oninput=render);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!profiles.length)importFileFetch();renderProfiles();render();
async function importFileFetch(){try{let p=await (await fetch("profiles/aikatsu-encore-01.json")).json();profiles=[p];activeId=p.id;save();localStorage.setItem("cardcollector-active",activeId)}catch(e){}}
</script></body></html>
